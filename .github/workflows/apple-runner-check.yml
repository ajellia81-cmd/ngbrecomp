name: Check alternate Apple runner
on:
  push:
    branches: [macos-on-ios-upstream072-runner-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
    - name: Confirm Apple Silicon and installed toolchains
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        sw_vers
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        for app in /Applications/Xcode*.app; do basename "$app"; done
