name: Check alternate Apple runner
on:
  push:
    branches: [macos-on-ios-upstream072-runner-check]
permissions:
  contents: read
concurrency:
  group: runner-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
    - name: Confirm Intel Mac host and ARM64 cross compiler
      shell: bash
      run: |
        test "$(uname -m)" = x86_64
        sw_vers
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        for app in /Applications/Xcode*.app; do basename "$app"; done
        printf 'int fixture(void){return 1;}\n' > "$RUNNER_TEMP/arm64-fixture.c"
        xcrun --sdk macosx clang -arch arm64 -c "$RUNNER_TEMP/arm64-fixture.c" -o "$RUNNER_TEMP/arm64-fixture.o"
        file "$RUNNER_TEMP/arm64-fixture.o"
