name: Public ARM64 renderer cross-build check
on:
  push:
    branches: [macos-on-ios-upstream072-cross-check]
permissions:
  contents: read
concurrency:
  group: public-cross-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Apply reviewed public UI patch
      run: git apply --unidiff-zero porting/macos-on-ios/ui-adapters.patch
    - name: Prepare public ARM64 dependencies
      shell: bash
      run: |
        set -euo pipefail
        brew install cmake ninja pkg-config
        bash xboxrecomp/third_party/fetch.sh
        python3 porting/macos-on-ios/arm64_dependencies.py "$RUNNER_TEMP/public-arm-prefix" "$RUNNER_TEMP/public-arm-bottles"
    - name: Package a public ARM64 fixture without any game input or IPA
      shell: bash
      run: |
        set -euo pipefail
        # This synthetic executable only tests library bundling and is never delivered.
        printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/public-fixture.c"
        xcrun --sdk macosx clang -arch arm64 -Wl,-headerpad_max_install_names "$RUNNER_TEMP/public-fixture.c" -o "$RUNNER_TEMP/public-fixture"
        mkdir "$RUNNER_TEMP/public-korean-fixture"
        printf '{"fixture":true}\n' > "$RUNNER_TEMP/public-korean-fixture/manifest.json"
        export NGB_DEPENDENCY_PREFIX="$RUNNER_TEMP/public-arm-prefix"
        python3 porting/macos-on-ios/package_mac.py "$RUNNER_TEMP/public-fixture" "$RUNNER_TEMP/PublicFixture.app" "$RUNNER_TEMP/public-korean-fixture"
