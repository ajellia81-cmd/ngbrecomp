name: iOS production engine preflight

on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths:
      - '.github/workflows/ios-engine-preflight.yml'
      - 'ios/private_input.py'
      - 'ios/compile_generated.sh'
      - 'ios/build_engine.sh'
      - 'ios/report_build_errors.py'
      - 'ios/app.m'
      - 'ios/vcpu_image_test.c'
      - 'ios/audio_pause_test.c'
      - 'ios/build_icons.swift'
      - 'ios/native_settings_test.c'
      - 'ios/motion_test.cpp'
      - 'ios/game_hooks.c'
      - 'ios/language_policy.h'
      - 'ios/runtime_ui_test.c'
      - 'ios/presenter_descriptor_test.py'
      - 'ios/wrap_game_codegen_test.py'
      - 'ios/wrap_game_codegen.py'
      - 'src/quit_label.h'
      - 'ios/prepare_korean.py'
      - 'ios/merge_korean_codegen.py'
      - 'ios/korean.m'
      - 'ios/korean_archive_test.m'
      - 'ios/korean_codegen_test.py'
      - 'ios/dsp_mailbox_test.py'
      - 'ios/tab_lettering_preview.py'
      - 'ios/presenter_pair_test.py'
      - 'xboxrecomp/src/kernel/kernel_hal.c'
      - 'tools/pipeline.sh'
      - 'src/korean.h'
      - 'src/menu_mouse.c'
      - 'src/main_menu.c'
      - 'src/recomp_manual.c'
      - 'src/install.c'
      - 'xboxrecomp/src/kernel/kernel_xbox.c'
      - 'ios/target.cmake'
      - 'ios/Info.plist.in'
      - 'ios/package_ipa.sh'
      - 'src/main.c'
      - 'CMakeLists.txt'
      - 'src/launcher.c'
      - 'src/launcher.h'
      - 'src/pc_menu.c'
      - 'src/pause_tab.c'
      - 'src/ingame_menu.c'
      - 'src/d3d/vk/**'
      - 'src/d3d/gpu/**'
      - 'packaging/appimage/ngb.png'
      - 'src/fibers.c'
      - 'src/port.h'
      - 'xboxrecomp/src/platform/**'
      - 'xboxrecomp/src/apu/apu_sdl_out.c'
      - 'xboxrecomp/src/nv2a_vk/host/**'
      - 'xboxrecomp/src/nv2a_vk/xemu/pgraph/vk/instance.c'

permissions:
  contents: read

concurrency:
  group: ios-engine-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-platform:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile actual VM and scheduler sources for iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/ios-platform
          for source in win32_compat vcpu; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
              -isysroot "$SDK" -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter \
              -Ixboxrecomp/src -Ixboxrecomp/src/platform \
              -c "xboxrecomp/src/platform/$source.c" \
              -o "build/ios-platform/$source.o"
          done

          xcrun --sdk iphoneos ar rcs build/ios-platform/libngb-platform.a build/ios-platform/*.o
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -isysroot "$SDK" -Ixboxrecomp/src -Wall -Wextra -Werror \
            -c ios/bringup/portability_smoke.c -o build/ios-platform/portability.o
          # Compile the exact public UIKit orientation helpers with the device
          # SDK while private game generation is running in the other job.
          python3 - <<'PY'
          from pathlib import Path
          source=Path('ios/app.m').read_text()
          start=source.index('@interface NGBLandscapeController')
          end=source.index('static int safeMillion',start)
          Path('build/ios-platform/orientation.m').write_text(
              '#import <UIKit/UIKit.h>\n#include <stdio.h>\n'+source[start:end])
          PY
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -fobjc-arc -Wno-deprecated-declarations -c build/ios-platform/orientation.m \
            -o build/ios-platform/orientation.o
          file build/ios-platform/*.o

      - name: Check scheduler preemption when loaded as a separate image
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 -dynamiclib \
            -Ixboxrecomp/src -Ixboxrecomp/src/platform \
            ios/vcpu_image_test.c xboxrecomp/src/platform/win32_compat.c \
            xboxrecomp/src/platform/vcpu.c -o build/ios-platform/vcpu-image.dylib
          xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 -DNGB_VCPU_IMAGE_HOST \
            ios/vcpu_image_test.c -o build/ios-platform/vcpu-image-host
          build/ios-platform/vcpu-image-host "$PWD/build/ios-platform/vcpu-image.dylib"
          # Reproduce the original image-zero bug and ensure this test detects it.
          python3 - <<'PY'
          from pathlib import Path
          source = Path('xboxrecomp/src/platform/vcpu.c').read_text()
          old = 'header = (const struct mach_header_64 *)image.dli_fbase;'
          assert source.count(old) == 1
          Path('build/ios-platform/vcpu-old-image.c').write_text(source.replace(
              old, 'header = (const struct mach_header_64 *)_dyld_get_image_header(0);'))
          PY
          xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 -dynamiclib \
            -Ixboxrecomp/src -Ixboxrecomp/src/platform \
            ios/vcpu_image_test.c xboxrecomp/src/platform/win32_compat.c \
            build/ios-platform/vcpu-old-image.c -o build/ios-platform/vcpu-old-image.dylib
          set +e
          build/ios-platform/vcpu-image-host "$PWD/build/ios-platform/vcpu-old-image.dylib"
          result=$?
          set -e
          test "$result" -eq 1
      - name: Link the actual scheduler against device and simulator system libraries
        shell: bash
        run: |
          set -euo pipefail
          for sdk in iphoneos iphonesimulator; do
            target=arm64-apple-ios15.0
            if [ "$sdk" = iphonesimulator ]; then target="$target-simulator"; fi
            SDK="$(xcrun --sdk "$sdk" --show-sdk-path)"
            xcrun --sdk "$sdk" clang -target "$target" -isysroot "$SDK" \
              -std=c11 -O2 -Ixboxrecomp/src -Ixboxrecomp/src/platform \
              xboxrecomp/src/platform/win32_compat.c xboxrecomp/src/platform/vcpu.c \
              xboxrecomp/tests/vcpu_posix/test_main.c \
              -o "build/ios-platform/vcpu-link-$sdk"
          done
          # These CLI regression binaries are link checks, not runnable game IPAs.
      - name: Check existing macOS scheduler and thread behavior
        shell: bash
        run: |
          set -euo pipefail
          for test in vcpu_posix thread_suspend_posix; do
            xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 \
              -Ixboxrecomp/src -Ixboxrecomp/src/platform \
              xboxrecomp/src/platform/win32_compat.c xboxrecomp/src/platform/vcpu.c \
              "xboxrecomp/tests/$test/test_main.c" -o "build/ios-platform/$test"
            "build/ios-platform/$test"
          done

      - name: Check lifecycle audio with a silent SDL device
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list sdl2 >/dev/null 2>&1; then brew install sdl2; fi
          xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 -Ixboxrecomp/src \
            $(pkg-config --cflags sdl2) ios/audio_pause_test.c \
            xboxrecomp/src/apu/apu_sdl_out.c $(pkg-config --libs sdl2) \
            -o build/ios-platform/audio-pause
          SDL_AUDIODRIVER=dummy build/ios-platform/audio-pause
          xcrun --sdk macosx clang -arch arm64 -std=c11 -O2 -DNGB_IOS_APP=1 -DNGB_IOS_KOREAN=1 \
            -Isrc -Ixboxrecomp/src $(pkg-config --cflags sdl2) \
            ios/native_settings_test.c src/launcher.c $(pkg-config --libs sdl2) \
            -o build/ios-platform/native-settings
          build/ios-platform/native-settings
          xcrun --sdk macosx clang -arch arm64 -fobjc-arc -std=gnu11 \
            -framework Foundation ios/korean_archive_test.m -o build/ios-platform/korean-archive
          build/ios-platform/korean-archive


      - name: Check Options language, pair ownership, safe FPS placement and codegen hooks
        run: |
          xcrun --sdk macosx clang -std=c11 -O2 -Iios -Ixboxrecomp/src \
            ios/runtime_ui_test.c -o build/ios-platform/runtime-ui
          build/ios-platform/runtime-ui
          python3 ios/wrap_game_codegen_test.py
          python3 ios/korean_codegen_test.py
          python3 ios/dsp_mailbox_test.py
          python3 ios/tab_lettering_preview.py
          python3 ios/presenter_descriptor_test.py
      - name: Compile actual Smooth Motion shaders and retained-pose tests
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v glslangValidator >/dev/null; then brew install glslang; fi
          mkdir -p build/ios-platform/motion
          xcrun --sdk macosx clang++ -arch arm64 -std=c++20 -O2 -DNGB_SMOOTH_MOTION=1 \
            -Isrc/d3d ios/motion_test.cpp src/d3d/gpu/shaders.cpp -o build/ios-platform/motion-test
          build/ios-platform/motion-test build/ios-platform/motion
          for shader in build/ios-platform/motion/*.vert.hlsl; do
            glslangValidator -D -V --target-env vulkan1.1 --auto-map-locations \
              -S vert -e main "$shader" -o "$shader.spv"
          done

  private-recompilation:
    # Standard GitHub-hosted runner: never the owner's PC or a paid larger runner.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require private disc input
        env:
          NGB_DISC_URL: ${{ secrets.NGB_DISC_URL }}
        run: |
          if [ -z "$NGB_DISC_URL" ]; then
            echo '::error::Add repository Actions secret NGB_DISC_URL containing the owner-provided Google Drive file link. No ISO or generated source is uploaded by this workflow.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated download and generation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ngb-input-tools"
          "$RUNNER_TEMP/ngb-input-tools/bin/pip" install 'gdown==6.4.2'
          python3 -m venv xboxrecomp/.venv
          xboxrecomp/.venv/bin/pip install 'capstone==5.0.3'
      - name: Download disc and validate the supported executable
        env:
          NGB_DISC_URL: ${{ secrets.NGB_DISC_URL }}
          NGB_DISC_SHA256: ${{ secrets.NGB_DISC_SHA256 }}
        run: |
          "$RUNNER_TEMP/ngb-input-tools/bin/python" ios/private_input.py \
            --download --iso "$RUNNER_TEMP/ngb-private.iso"
          rm -f "$RUNNER_TEMP/ngb-private.iso"
      - name: Generate real game C using the existing pipeline
        shell: bash
        run: |
          set -euo pipefail
          if ! bash tools/pipeline.sh > "$RUNNER_TEMP/ngb-pipeline-private.log" 2>&1; then
            echo '::error::Private recompilation failed. Raw logs are withheld because they can contain game-derived code. No placeholder executable was built.'
            exit 1
          fi
          test -s src/recomp/gen/recomp_types.h
          python3 - <<'PY'
          from pathlib import Path
          sources = list(Path('src/recomp/gen').glob('*.c'))
          if not sources:
              raise SystemExit('No generated game C files')
          print('Generated game C translation units:', len(sources))
          PY
      - name: Prepare verified Korean variants without replacing original game functions
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/prepare_korean.py --source game_files/default.xbe \
            --zip "$RUNNER_TEMP/ngb-korean-patch.zip" --download --output "$RUNNER_TEMP/ngb-korean"
          export NGB_RECOMP_XBE="$RUNNER_TEMP/ngb-korean/korean.xbe"
          export NGB_RECOMP_GEN_DIR="$RUNNER_TEMP/ngb-korean/gen"
          export NGB_RECOMP_MANUAL="$RUNNER_TEMP/ngb-korean/manual-korean.json"
          export NGB_RECOMP_ANALYSIS="$RUNNER_TEMP/ngb-korean/analysis.json"
          ready=0
          for pass in 1 2 3 4 5 6; do
            if [ -s "$RUNNER_TEMP/ngb-korean/continuations.json" ]; then
              export NGB_RECOMP_EXTRA_SEEDS="$RUNNER_TEMP/ngb-korean/continuations.json"
            fi
            if ! bash tools/pipeline.sh > "$RUNNER_TEMP/ngb-korean-pipeline-private.log" 2>&1; then
              echo '::error::Private Korean code generation failed; raw game-derived logs are withheld.'
              exit 1
            fi
            set +e
            python3 ios/merge_korean_codegen.py --original src/recomp/gen --translated "$NGB_RECOMP_GEN_DIR" \
              --missing-seeds "$RUNNER_TEMP/ngb-korean/continuations.json"
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then ready=1; break; fi
            if [ "$result" -ne 2 ]; then exit "$result"; fi
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Korean continuations remain untranslated; refusing to substitute stubs.'
            exit 1
          fi
      - name: Bind original Options text language to the private Korean boot
        run: python3 ios/wrap_game_codegen.py src/recomp/gen
      - name: Compile production game fibers with real generated headers
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/ios-private
          # Compiler diagnostics can quote lifted source, so retain them privately.
          if ! xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -isysroot "$SDK" -std=c11 -O2 -fno-strict-aliasing \
            -Ixboxrecomp/include -Ixboxrecomp/src -Ixboxrecomp/src/kernel \
            -c src/fibers.c -o build/ios-private/fibers.o \
            > "$RUNNER_TEMP/ngb-fibers-private.log" 2>&1; then
            echo '::error::Production fiber compilation failed. Private compiler diagnostics were not published.'
            exit 1
          fi
          echo 'Production game fibers compiled for iPhoneOS ARM64; this is not a linked or playable IPA.'
      - name: Restore only public device dependency packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ngb-dependency-cache
          key: iphoneos-arm64-vcpkg-0c2a9ace-xcode16-release-cf-v1
      - name: Prepare device dependencies for whole-engine linking
        run: |
          mkdir -p "$RUNNER_TEMP/ngb-dependency-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$RUNNER_TEMP/ngb-dependency-cache,readwrite"
          bash ios/build_dependencies.sh "$RUNNER_TEMP/ngb-ios-tools"
      - name: Compile and link the original game engine target
        run: |
          export NGB_KOREAN_ASSET_DIR="$RUNNER_TEMP/ngb-korean/KoreanPatch"
          bash ios/build_engine.sh "$RUNNER_TEMP/ngb-ios-tools" build/ios-private/engine
      - name: Validate the real game bundle and package unsigned IPA privately
        run: |
          bash ios/package_ipa.sh build/ios-private/engine/NinjaGaidenBlack.app \
            build/ios-private/package "$RUNNER_TEMP/ngb-ios-tools"
      - name: Prepare private artifact delivery
        id: delivery
        env:
          NGB_IPA_PASSWORD: ${{ secrets.NGB_IPA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NGB_IPA_PASSWORD" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Game IPA was built, but not published. Add NGB_IPA_PASSWORD to deliver it as an encrypted artifact.'
            exit 0
          fi
          if [ "${#NGB_IPA_PASSWORD}" -lt 16 ]; then
            echo '::error::NGB_IPA_PASSWORD must contain at least 16 characters.'
            exit 1
          fi
          if ! command -v 7zz >/dev/null; then brew install sevenzip; fi
          mkdir -p build/private-delivery
          ARCHIVE="$PWD/build/private-delivery/NinjaGaidenBlack-ios-arm64-unsigned.ipa.7z"
          (cd build/ios-private/package && \
            7zz a -t7z -mx=0 -mhe=on -p"$NGB_IPA_PASSWORD" -bso0 -bsp0 \
              "$ARCHIVE" NinjaGaidenBlack-ios-arm64-unsigned.ipa)
          7zz t -p"$NGB_IPA_PASSWORD" -bso0 -bsp0 \
            build/private-delivery/NinjaGaidenBlack-ios-arm64-unsigned.ipa.7z
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload encrypted game IPA only
        if: steps.delivery.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NinjaGaidenBlack-iOS-ARM64-encrypted-IPA
          path: build/private-delivery/*.ipa.7z
          if-no-files-found: error
          retention-days: 7
      - name: Remove private inputs, generated code and logs
        if: always()
        shell: bash
        run: |
          rm -rf game_files src/recomp/gen xboxrecomp/.venv build/ios-private build/private-delivery build/analysis
          rm -f recomp_log.txt "$RUNNER_TEMP/ngb-private.iso" "$RUNNER_TEMP/ngb-private.iso.part"
          rm -f "$RUNNER_TEMP/download-private.log" "$RUNNER_TEMP/ngb-pipeline-private.log" "$RUNNER_TEMP/ngb-fibers-private.log"
          rm -rf "$RUNNER_TEMP/ngb-input-tools"
          rm -rf "$RUNNER_TEMP/ngb-korean"
          rm -f "$RUNNER_TEMP/ngb-korean-patch.zip" "$RUNNER_TEMP/ngb-korean-pipeline-private.log"
    # Deliberately no upload-artifact, cache, commit, or release of game-derived files.
