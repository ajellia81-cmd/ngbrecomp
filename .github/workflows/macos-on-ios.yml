name: macOS-on-iOS clean 60fps comparison IPA
'on':
  push:
    branches:
    - macos-on-ios-rebuild
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ngb-mac-conversion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convert:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Check untouched macOS shader/compiler baseline
      run: |-
        python3 porting/macos-on-ios/check_baseline.py
    - name: Compile public iPhone compatibility UI before private generation
      run: |
        xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -fobjc-arc -Iporting/macos-on-ios -c porting/macos-on-ios/AppKit_NGB.m -o "$RUNNER_TEMP/ngb-ui-bridge.o"
        xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -fobjc-arc -c porting/macos-on-ios/korean/haptics.m -o "$RUNNER_TEMP/ngb-haptics-bridge.o"
    - name: Check SDL cursor image storage and ownership without game data
      run: |
        xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -fobjc-arc -c porting/macos-on-ios/AppKit_NGBImages.m -o "$RUNNER_TEMP/ngb-image-bridge.o"
        xcrun --sdk macosx clang -fobjc-arc -fsanitize=address porting/macos-on-ios/tests/image_storage.m -framework Foundation -framework CoreGraphics -framework ImageIO -o "$RUNNER_TEMP/ngb-image-storage-test"
        "$RUNNER_TEMP/ngb-image-storage-test"
    - name: Check sandbox-local Xbox shared-memory aliases without game data
      run: |
        xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -fobjc-arc -c porting/macos-on-ios/libSystem_NGBSharedMemory.m -o "$RUNNER_TEMP/ngb-shared-memory.o"
        xcrun --sdk macosx clang -fobjc-arc -fsanitize=address porting/macos-on-ios/tests/shared_memory.m -framework Foundation -o "$RUNNER_TEMP/ngb-shared-memory-test"
        "$RUNNER_TEMP/ngb-shared-memory-test"
    - name: Require private disc input
      env:
        NGB_DISC_URL: ${{ secrets.NGB_DISC_URL }}
      run: |
        if [ -z "$NGB_DISC_URL" ]; then
          echo '::error::Add repository Actions secret NGB_DISC_URL containing the owner-provided Google Drive file link. No ISO or generated source is uploaded by this workflow.'
          exit 1
        fi
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare isolated download and generation tools
      run: |
        python3 -m venv "$RUNNER_TEMP/ngb-input-tools"
        "$RUNNER_TEMP/ngb-input-tools/bin/pip" install 'gdown==6.4.2'
        python3 -m venv xboxrecomp/.venv
        xboxrecomp/.venv/bin/pip install 'capstone==5.0.3'
    - name: Download disc and validate the supported executable
      env:
        NGB_DISC_URL: ${{ secrets.NGB_DISC_URL }}
        NGB_DISC_SHA256: ${{ secrets.NGB_DISC_SHA256 }}
      run: |
        "$RUNNER_TEMP/ngb-input-tools/bin/python" porting/macos-on-ios/korean/private_input.py \
          --download --iso "$RUNNER_TEMP/ngb-private.iso"
        rm -f "$RUNNER_TEMP/ngb-private.iso"
    - name: Generate real game C using the existing pipeline
      shell: bash
      run: |
        set -euo pipefail
        if ! bash tools/pipeline.sh > "$RUNNER_TEMP/ngb-pipeline-private.log" 2>&1; then
          echo '::error::Private recompilation failed. Raw logs are withheld because they can contain game-derived code. No placeholder executable was built.'
          exit 1
        fi
        test -s src/recomp/gen/recomp_types.h
        python3 - <<'PY'
        from pathlib import Path
        sources = list(Path('src/recomp/gen').glob('*.c'))
        if not sources:
            raise SystemExit('No generated game C files')
        print('Generated game C translation units:', len(sources))
        PY
    - name: Prepare verified Korean variants without replacing original game functions
      shell: bash
      run: |
        set -euo pipefail
        python3 porting/macos-on-ios/korean/prepare_korean.py --source game_files/default.xbe \
          --zip "$RUNNER_TEMP/ngb-korean-patch.zip" --download --output "$RUNNER_TEMP/ngb-korean"
        export NGB_RECOMP_XBE="$RUNNER_TEMP/ngb-korean/korean.xbe"
        export NGB_RECOMP_GEN_DIR="$RUNNER_TEMP/ngb-korean/gen"
        export NGB_RECOMP_MANUAL="$RUNNER_TEMP/ngb-korean/manual-korean.json"
        export NGB_RECOMP_ANALYSIS="$RUNNER_TEMP/ngb-korean/analysis.json"
        ready=0
        for pass in 1 2 3 4 5 6; do
          if [ -s "$RUNNER_TEMP/ngb-korean/continuations.json" ]; then
            export NGB_RECOMP_EXTRA_SEEDS="$RUNNER_TEMP/ngb-korean/continuations.json"
          fi
          if ! bash tools/pipeline.sh > "$RUNNER_TEMP/ngb-korean-pipeline-private.log" 2>&1; then
            echo '::error::Private Korean code generation failed; raw game-derived logs are withheld.'
            exit 1
          fi
          set +e
          python3 porting/macos-on-ios/korean/merge_korean_codegen.py --original src/recomp/gen --translated "$NGB_RECOMP_GEN_DIR" \
            --missing-seeds "$RUNNER_TEMP/ngb-korean/continuations.json"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then ready=1; break; fi
          if [ "$result" -ne 2 ]; then exit "$result"; fi
        done
        if [ "$ready" -ne 1 ]; then
          echo '::error::Korean continuations remain untranslated; refusing to substitute stubs.'
          exit 1
        fi
    - name: Bind original Options text language to the private Korean boot
      run: |-
        python3 porting/macos-on-ios/korean/wrap_game_codegen.py src/recomp/gen
    - name: Prepare native macOS ARM64 dependencies
      run: |-
        brew install cmake ninja pkg-config sdl2-compat sdl3 libepoxy glib glslang molten-vk vulkan-loader sevenzip
        bash xboxrecomp/third_party/fetch.sh
    - name: Compile original engine for macOS ARM64, not iPhoneOS
      shell: bash
      run: |-
        set -euo pipefail
        cmake -S . -B "$RUNNER_TEMP/ngb-mac-engine" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE > "$RUNNER_TEMP/mac-config-private.log" 2>&1
        if ! cmake --build "$RUNNER_TEMP/ngb-mac-engine" --target NinjaGaidenBlack -j2 -- -k0 > "$RUNNER_TEMP/mac-compile-private.log" 2>&1; then
         echo '::error::Native macOS build failed. Generated-code diagnostics remain private.'
         python3 porting/macos-on-ios/report_build_errors.py "$RUNNER_TEMP/mac-compile-private.log"
         exit 1
        fi
        python3 porting/macos-on-ios/package_mac.py "$RUNNER_TEMP/ngb-mac-engine/NinjaGaidenBlack" "$RUNNER_TEMP/Ninja Gaiden Black.app" "$RUNNER_TEMP/ngb-korean/KoreanPatch"
    - name: Fetch checksum-pinned macOS-on-iOS compatibility layer
      run: |-
        git clone https://github.com/zorrobyte/macos-on-ios-public.git "$RUNNER_TEMP/ngb-compat"
        git -C "$RUNNER_TEMP/ngb-compat" checkout c2562a333d4de4c08da4ceb4a4f1485bddb84e04
        python3 porting/macos-on-ios/prepare_conversion.py "$RUNNER_TEMP/ngb-compat"
      shell: bash
    - name: Convert Mac app, preserving original game machine instructions
      run: |-
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ngb-converted"
        python3 "$RUNNER_TEMP/ngb-compat/tools/convert_app.py" "$RUNNER_TEMP/Ninja Gaiden Black.app" "$RUNNER_TEMP/ngb-converted/NinjaGaidenBlack.app" com.ngbrecomp.game --profile /dev/null --identity - --team UNSIGNED --no-metal-hud > "$RUNNER_TEMP/conversion-private.log" 2>&1 || { echo '::error::Compatibility conversion failed.'; python3 porting/macos-on-ios/report_build_errors.py "$RUNNER_TEMP/conversion-private.log"; exit 1; }
        python3 porting/macos-on-ios/package_ipa.py "$RUNNER_TEMP/Ninja Gaiden Black.app" "$RUNNER_TEMP/ngb-converted/NinjaGaidenBlack.app" "$RUNNER_TEMP/ngb-package/NinjaGaidenBlack-macos-on-ios.ipa"
      shell: bash
    - name: Prepare private artifact delivery
      id: delivery
      env:
        NGB_IPA_PASSWORD: ${{ secrets.NGB_IPA_PASSWORD }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$NGB_IPA_PASSWORD" ]; then
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'Game IPA was built, but not published. Add NGB_IPA_PASSWORD to deliver it as an encrypted artifact.'
          exit 0
        fi
        if [ "${#NGB_IPA_PASSWORD}" -lt 16 ]; then
          echo '::error::NGB_IPA_PASSWORD must contain at least 16 characters.'
          exit 1
        fi
        if ! command -v 7zz >/dev/null; then brew install sevenzip; fi
        mkdir -p build/private-delivery
        ARCHIVE="$PWD/build/private-delivery/NinjaGaidenBlack-macos-on-ios.ipa.7z"
        (cd "$RUNNER_TEMP/ngb-package" && \
          7zz a -t7z -mx=0 -mhe=on -p"$NGB_IPA_PASSWORD" -bso0 -bsp0 \
            "$ARCHIVE" NinjaGaidenBlack-macos-on-ios.ipa)
        7zz t -p"$NGB_IPA_PASSWORD" -bso0 -bsp0 \
          build/private-delivery/NinjaGaidenBlack-macos-on-ios.ipa.7z
        echo 'ready=true' >> "$GITHUB_OUTPUT"
    - name: Upload encrypted game IPA only
      if: steps.delivery.outputs.ready == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: NinjaGaidenBlack-macOS-on-iOS-60fps-encrypted-IPA
        path: build/private-delivery/*.ipa.7z
        if-no-files-found: error
        retention-days: 7
    - name: Remove private build inputs
      if: always()
      run: |-
        rm -rf game_files src/recomp/gen "$RUNNER_TEMP/ngb-korean" "$RUNNER_TEMP/ngb-mac-engine" "$RUNNER_TEMP/Ninja Gaiden Black.app" "$RUNNER_TEMP/ngb-converted" "$RUNNER_TEMP/ngb-package"
        rm -f "$RUNNER_TEMP/ngb-private.iso" "$RUNNER_TEMP/"*private.log
