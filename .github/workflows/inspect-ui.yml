name: Inspect result prompt metadata
'on':
  push:
    branches: [macos-on-ios-upstream072-ui-inspect, macos-on-ios-upstream072-ui-inspect-readiness]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install gdown==6.4.2 capstone==5.0.3
      - name: Prepare owner-authorized private input
        env:
          NGB_DISC_URL: ${{ secrets.NGB_DISC_URL }}
          NGB_DISC_SHA256: ${{ secrets.NGB_DISC_SHA256 }}
        run: python3 porting/macos-on-ios/korean/private_input.py --download --iso "$RUNNER_TEMP/disc.iso"
      - name: Inspect chapter gate metadata without game-code output
        run: python3 porting/macos-on-ios/tests/inspect_loading_metadata.py
      - if: always()
        run: rm -rf game_files "$RUNNER_TEMP/disc.iso"
