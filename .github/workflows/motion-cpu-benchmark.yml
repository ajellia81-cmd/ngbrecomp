name: Synthetic Apple CPU comparison
'on':
  push:
    branches:
      - ngb-motion-cpu-benchmark-20261117
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare fixed public CPU variants without game data
        run: python3 tests/motion_cpu_benchmark.py --temp "$RUNNER_TEMP/ngb-cpu-comparison"
