name: iOS full runtime build

on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths:
      - '.github/workflows/ios-runtime-build.yml'
      - 'ios/build_dependencies.sh'
      - 'ios/triplets/**'
      - 'CMakeLists.txt'
      - 'src/d3d/**'
      - 'ios/app.m'
      - 'xboxrecomp/src/**'
      - 'xboxrecomp/CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: ios-runtime-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore open-source dependency cache (never game code)
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ngb-dependency-cache
          key: iphoneos-arm64-vcpkg-0c2a9ace-xcode16-release-cf-v1
      - name: Build device dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ngb-dependency-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$RUNNER_TEMP/ngb-dependency-cache,readwrite"
          bash ios/build_dependencies.sh "$RUNNER_TEMP/ngb-ios-tools"
      - name: Configure the existing full runtime and game renderer for iPhoneOS
        shell: bash
        run: |
          set -euo pipefail
          VCPKG="$RUNNER_TEMP/ngb-ios-tools/vcpkg"
          export PKG_CONFIG_LIBDIR="$VCPKG/installed/arm64-ios/lib/pkgconfig:$VCPKG/installed/arm64-ios/share/pkgconfig"
          cmake -S . -B build/ios-runtime -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ios/triplets" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release -DNGB_NV2A_VK=ON -DNGB_RENDERER_CHECK_ONLY=ON
      - name: Build actual runtime and game Direct3D Vulkan renderer objects
        run: cmake --build build/ios-runtime --parallel 2
      - name: Compile the real UIKit import and touch input bridge
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          VCPKG="$RUNNER_TEMP/ngb-ios-tools/vcpkg"
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -fobjc-arc -std=gnu11 -Wall -Wextra -Werror=implicit-function-declaration \
            '-DNGB_IOS_BUILD_VERSION="check-only"' '-DNGB_IOS_BUILD_COMMIT="check-only"' \
            -Werror=objc-method-access -Ixboxrecomp/src \
            -I"$VCPKG/installed/arm64-ios/include/SDL2" \
            -Ixboxrecomp/third_party/volk -Ixboxrecomp/third_party/Vulkan-Headers/include \
            -c ios/app.m -o build/ios-runtime/ios-app.o
      - name: Preserve completed open-source packages even if a later compile fails
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ngb-dependency-cache
          key: iphoneos-arm64-vcpkg-0c2a9ace-xcode16-release-cf-v1
    # Only the isolated vcpkg cache contains binaries; no game inputs are used here.
